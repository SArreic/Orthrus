syntax = "proto3";

option go_package = "./;protobufs";

package protobufs;

message ClientRequest {
    RequestID request_id = 1;
    bytes payload = 2;
    bytes payload_random = 3;
    bytes pubkey = 4;
    bytes signature = 5;
    int32 is_contract = 6;

    // 新增：合约调用信息（如果是合约）
    string contract_type = 7;      // 如："counter", "kvstore", "token"
    string contract_function = 8;  // 如："increment", "set", "transfer"
    string contract_payload = 9;   // 如："key=x,value=10"
}

message ClientResponse {
    int32 client_sn = 1;
    int32 order_sn = 2;
}

message RequestID {
    int32 client_id = 1;
    int32 client_sn = 2;
    int32 sender_id = 3;
}

message Batch {
    repeated ClientRequest requests = 1;
}

message MissingEntryRequest {
    int32 sn = 1;
    bool payload_request = 2;
}

message MissingEntry {
    int32 sn = 1;
    Batch batch = 2;
    bytes digest = 3;
    bool aborted = 4;
    int32 suspect = 5;
    string proof = 6; // This is a dummy proof. TODO: Implement a proper one, like a Merkle proof wrt. the checkpoint.
}

message BucketSubscription {
    int32 client_id = 1;
}

message BucketAssignment {
    int32 epoch = 1;
    map<int32, ListOfInt32> buckets = 2;
}

message ListOfInt32 {
    repeated int32 vals = 1;
}

message Transaction {
  int32 id = 1;
  string sender_hash = 2;
  string receiver_hash = 3;
  double amount = 4;
  double fee = 5;
  string ContractCode = 6;                // 合约代码（部署用）
  string ContractMethod = 7;             // 合约方法名
  map<string, string> ContractArgs = 8;  // 合约参数
}

